name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install image processing dependency
        run: python -m pip install Pillow==12.3.0
      - name: Install video decoding dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build and type-check frontend
        run: |
          node --version
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run build --prefix frontend
          npm run typecheck --prefix frontend
      - name: Validate package inputs
        run: python tools/check_release.py
      - name: Structure and update tests
        run: python -m unittest discover -s tests -v
      - name: Install current browser regression dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/frame-ui-check" playwright@1.56.1 --ignore-scripts --no-audit --no-fund
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/frame-browsers" node "$RUNNER_TEMP/frame-ui-check/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Current React Flow browser regression
        env:
          NODE_PATH: ${{ runner.temp }}/frame-ui-check/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/frame-browsers
          FRAME_BROWSER: chromium
        run: python tools/test_browser.py
      - name: R15 feature browser checks (mock AI only)
        env:
          NODE_PATH: ${{ runner.temp }}/frame-ui-check/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/frame-browsers
          FRAME_BROWSER: chromium
          FRAME_QA_TEST: r15-browser.cjs
          FRAME_QA_OUTPUT: dist/r15-browser-checks.json
        run: python tools/test_browser.py
      - name: Build clean installer
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: frame-source-verified-build
          path: dist/*
          if-no-files-found: error
