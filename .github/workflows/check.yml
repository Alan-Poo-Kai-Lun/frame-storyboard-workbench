name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install image processing dependency
        run: python -m pip install Pillow==12.3.0
      - name: Validate package inputs
        run: python tools/check_release.py
      - name: Structure and update tests
        run: python -m unittest discover -s tests -v
      - name: Frontend interaction checks
        run: |
          npm install --prefix "$RUNNER_TEMP/frame-ui-check" jsdom@26.1.0 --ignore-scripts --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/frame-ui-check/node_modules" node tests/test_startup_ui.cjs
          NODE_PATH="$RUNNER_TEMP/frame-ui-check/node_modules" node tests/test_dynamic_background.cjs
          NODE_PATH="$RUNNER_TEMP/frame-ui-check/node_modules" node tests/test_canvas_clipboard.cjs
          NODE_PATH="$RUNNER_TEMP/frame-ui-check/node_modules" node tests/test_canvas_effects.cjs
          NODE_PATH="$RUNNER_TEMP/frame-ui-check/node_modules" node tests/test_canvas_lifecycle.cjs
      - name: Build clean installer
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: frame-source-verified-build
          path: dist/*
          if-no-files-found: error
